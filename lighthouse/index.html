<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>등대지기의 시험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0e;--panel:#1d2026;--tile:#2a2e36;--tile-h:#3a404c;--text:#ebe8e0;--mut:#9aa0ab;--gold:#e0b862;--bad:#f08a7c;--ok:#8fd4a0;--line:#3a3f49;--ink:#2b1c0c;--hand:"Nanum Pen Script",cursive;--sw:100vw;--sh:56vw;--bar:0px;--u:1;--slot:60px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#000;color:var(--text);font:16px/1.6 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:44px}
.btn:hover{background:var(--tile-h)}
.btn.gold{background:#7a5c1e;border-color:#a8822f}
.btn:disabled{opacity:.45;cursor:default}
.mut{color:var(--mut)}
.bad{color:var(--bad)}.ok{color:var(--ok)}

.game{position:fixed;inset:0;overflow:hidden;background:#000}
.game .stage{position:absolute;left:50%;top:50%;width:var(--sw);height:var(--sh);transform:translate(-50%,-50%);overflow:hidden;container-type:size}
.stage>img{position:absolute;inset:0;display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.stage .layer{position:absolute;display:block;opacity:0;transition:opacity .9s ease;pointer-events:none;user-select:none}
.stage .layer.on{opacity:1}
.stage .hot{position:absolute;z-index:1;padding:0;margin:0;background:transparent;border:2px solid transparent;border-radius:4px;cursor:default;-webkit-tap-highlight-color:transparent}
.stage .hot:focus,.stage .hot:focus-visible{outline:none;background:transparent;border-color:transparent}
.hud{position:absolute;left:0;right:0;top:calc(var(--bar) * 0);z-index:3;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(12px * var(--u)) calc(20px * var(--u)) calc(44px * var(--u));background:linear-gradient(rgba(0,0,0,.74),rgba(0,0,0,0));pointer-events:none}
.hud>*{pointer-events:auto}
.loc{min-width:0}
.loc b{display:block;font-size:calc(19px * var(--u));line-height:1.3;color:#f1ddb0;text-shadow:0 1px 4px #000}
.loc span{display:block;font-size:calc(15px * var(--u));line-height:1.35;color:#d8d0bf;text-shadow:0 1px 4px #000}
.hr{display:flex;gap:10px;align-items:center;flex:none}
#who{font-size:calc(16px * var(--u));color:#f1ddb0;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
#hintBtn{font-size:calc(16px * var(--u));color:#cfc7b6;background:rgba(20,20,22,.55);border:1px solid rgba(255,255,255,.25);padding:4px 14px;border-radius:22px;backdrop-filter:blur(3px);min-height:38px;white-space:nowrap;font-variant-numeric:tabular-nums}
#hintBtn.ready{color:#ffe7a6;border-color:#e0b45c;box-shadow:0 0 14px rgba(224,180,92,.55)}
.game.lb .hud{height:var(--bar);padding:0 calc(20px * var(--u));align-items:center;background:none}
.game.lb .loc{display:flex;align-items:baseline;gap:12px;white-space:nowrap;overflow:hidden}
.game.lb .loc b{display:inline}
.game.lb .loc span{display:inline;overflow:hidden;text-overflow:ellipsis}
.say{position:absolute;left:50%;top:calc(var(--bar) + 66px * var(--u));transform:translateX(-50%);z-index:3;max-width:min(78%,1000px);font-size:calc(18px * var(--u));line-height:1.45;color:#f3ecdd;background:rgba(10,10,12,.62);padding:8px 20px;border-radius:12px;backdrop-filter:blur(3px);text-align:center;word-break:keep-all;white-space:pre-line;pointer-events:none}
.say:empty{display:none}
.say.bad{color:#ffc9bd}
.game.lb .say{top:calc(var(--bar) + 10px)}
.hintpanel{position:absolute;right:calc(16px * var(--u));top:calc(var(--bar) + 62px * var(--u));z-index:4;width:min(460px,62%);background:rgba(12,12,14,.82);border:1px solid rgba(224,180,92,.55);border-radius:14px;padding:12px 16px;backdrop-filter:blur(4px);font-size:calc(16px * var(--u));line-height:1.5;word-break:keep-all}
.game.lb .hintpanel{top:calc(var(--bar) + 8px)}
.hintpanel[hidden]{display:none}
.hptabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.hptabs button{font-size:.9em;padding:3px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.hptabs button.on{border-color:var(--gold);color:var(--gold)}
.hptabs button:disabled{opacity:.45;cursor:default}
.hintpanel .x{float:right;background:none;border:0;color:var(--mut);font-size:1.1em;padding:0 0 0 8px}
.bag{position:absolute;left:50%;bottom:calc(var(--bar) + 10px);transform:translateX(-50%);z-index:3;display:flex;gap:8px;padding:7px 9px;background:rgba(10,10,12,.48);border-radius:16px;backdrop-filter:blur(3px)}
.game.lb .bag{bottom:4px;background:rgba(10,10,12,.35)}
.slot{width:var(--slot);height:var(--slot);border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--slot) * .4);line-height:1.1;padding:2px;text-align:center}
.slot small{font-size:max(10px,calc(var(--slot) * .155));color:#d8d0bf;line-height:1.15;margin-top:2px;word-break:keep-all}
.slot.sel{border-color:var(--gold);background:rgba(122,92,30,.75);box-shadow:0 0 0 2px var(--gold) inset,0 0 14px rgba(224,184,98,.7)}
.slot.sel small{color:#fff;font-weight:700}
.slot.empty{cursor:default;opacity:.45}
.slot.new{animation:got 1.2s ease-out 2}
@keyframes got{0%{box-shadow:0 0 0 0 rgba(255,220,140,.9)}100%{box-shadow:0 0 0 14px rgba(255,220,140,0)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}
.pn{background:rgba(22,24,29,.9);border:1px solid #4a505c;border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto;backdrop-filter:blur(4px)}
.pn h3{margin:0 0 6px;color:var(--gold);font-size:18px}
.pn p{margin:6px 0}
.pn .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.bubble{position:absolute;transform:translateX(-50%);width:17%;min-width:128px;background:#f6f1e4;color:#1c1a16;border-radius:10px;padding:5px 8px;font-size:max(12px,1.05cqw);line-height:1.4;box-shadow:0 3px 12px rgba(0,0,0,.55);pointer-events:none;z-index:2;word-break:keep-all}
.bubble b{display:block;font-size:.9em;color:#7a5c1e}
.bubble::before{content:"";position:absolute;left:50%;top:-6px;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#f6f1e4}
table{border-collapse:collapse;width:100%;margin:8px 0}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:center}

.pn.panelpn{max-width:min(920px,96vw);padding:22px 26px;background:linear-gradient(160deg,#3a3025,#1f1a14 60%,#2b231a);border:2px solid #7a5f36;box-shadow:inset 0 0 40px rgba(0,0,0,.7),0 20px 60px rgba(0,0,0,.8)}
.pn.panelpn h3{color:#f1d79a}
.lamp{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5a4a32,#1d160e);border:3px solid #8a6a36;box-shadow:inset 0 2px 6px rgba(0,0,0,.8)}
.lamp.on{background:radial-gradient(circle at 40% 35%,#fff6c8,#f4c95a 55%,#a8701c);border-color:#ffe6a0;box-shadow:0 0 18px #f4d58a,0 0 40px rgba(244,213,138,.5)}
.cardrow{display:grid;grid-template-columns:96px 1fr 46px;gap:12px;align-items:center;margin:10px 0}
.pn.panelpn>p{font-family:var(--hand);font-size:26px;color:#f1e3c0;margin:2px 0 6px}
.card{min-height:76px;text-align:left;background:linear-gradient(rgba(250,242,222,.62),rgba(246,234,206,.62)),url("img/paper_tag.webp") center/cover;color:#1c1206;border:1px solid #6b5026;border-radius:6px;padding:8px 16px;font-family:var(--hand);font-size:27px;line-height:1.25;word-break:keep-all;box-shadow:0 3px 8px rgba(0,0,0,.6)}
.ol{display:inline-block;border-top:2px solid currentColor;line-height:1;padding-top:1px;margin:0 1px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:.95;margin:0 4px;font-size:1.15em}
.fr>i{font-style:normal;padding:0 3px}
.fr>i:first-child{border-bottom:2px solid currentColor;padding-bottom:1px}
.card.wide{grid-column:1 / 3}
.card.on{box-shadow:0 0 0 3px #f4d58a,0 0 18px rgba(244,213,138,.7)}
.card.empty{background:rgba(0,0,0,.35);color:#cdbd9c;border-style:dashed;box-shadow:none}
.card:disabled{cursor:default}
.fig{height:76px;padding:2px;background:#f4ecd8;color:#111;border:1px solid #6b5026;border-radius:6px;cursor:zoom-in}
.fig svg{display:block;width:100%;height:100%;fill:#111}
.figbig{background:#fff;color:#111;border-radius:10px;padding:8px}
.figbig svg{display:block;width:100%;max-height:56vh;fill:#111}
.pn.lockpn{max-width:720px;background:rgba(20,16,11,.86);border-color:#6b5026}
.lock{border-radius:12px;overflow:hidden;margin:8px 0}
.lock svg{display:block;width:100%;max-height:54vh;user-select:none}
.lock.won svg{filter:drop-shadow(0 0 14px #ffd45a) brightness(1.12)}
.lock.shake,.plate.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lock .digit{font-family:"Times New Roman",serif;font-weight:700;font-variant-numeric:lining-nums;fill:#2c1a06;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lock .wheel{cursor:pointer;outline:none}
.lock .zone{fill:transparent}
.lock .wheel:hover .zone,.lock .wheel:focus-visible .zone{fill:rgba(255,196,84,.2)}
.lock .arrow{fill:#7a5a22;opacity:.6;pointer-events:none}
.lock .roll{animation:roll .22s ease-out}
@keyframes roll{from{transform:translateY(var(--from));opacity:.2}to{transform:none;opacity:1}}

.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.64);display:flex;align-items:center;justify-content:center;container-type:size;animation:fxfade .35s both;cursor:pointer}
.sheet .tap{position:absolute;left:0;right:0;bottom:2.2cqh;text-align:center;font-size:14px;color:#cfc7b6;opacity:.75;pointer-events:none}
.paper{position:relative;container-type:inline-size;font-family:var(--hand);color:var(--ink);word-break:keep-all;line-height:1.22;cursor:default}
.paper::before{content:"";position:absolute;inset:0;background:var(--pimg) center/100% 100% no-repeat;filter:drop-shadow(0 22px 40px rgba(0,0,0,.8))}
.paper>*{position:relative}
.paper p{margin:0}
.paper .go{display:inline-block;font-family:var(--hand);color:#f6e7c4;background:#6d2a14;border:0;border-radius:10px;padding:.05em .8em .15em;box-shadow:0 4px 0 #3e170a;transform:rotate(-1.5deg);line-height:1.15}
.paper .go:hover{background:#82351b}
.paper.note{--pimg:url("img/paper_note.webp");--pw:min(86cqw,80cqh * 1.52);width:var(--pw);aspect-ratio:1100/723;transform:rotate(-2deg);display:flex;flex-direction:column;justify-content:center;padding:calc(var(--pw) * .1) calc(var(--pw) * .12);text-align:center;text-shadow:0 0 1px rgba(43,28,12,.45)}
.paper.note .a{font-size:8.6cqw;transform:rotate(-1deg)}
.paper.note .b{font-size:7cqw;margin-top:4.5cqw;transform:rotate(.6deg)}
.paper.letter{--pimg:url("img/paper_letter.webp");--pw:min(64cqw,90cqh * .79);width:var(--pw);aspect-ratio:633/800;transform:rotate(.8deg);display:flex;flex-direction:column;justify-content:center;padding:calc(var(--pw) * .13) calc(var(--pw) * .13) calc(var(--pw) * .12) calc(var(--pw) * .14)}
.paper.letter h3{margin:0 0 3cqw;font-size:11.5cqw;font-weight:400;line-height:1}
.paper.letter p{font-size:7.4cqw;margin-bottom:2.4cqw}
.paper.letter .go{font-size:9cqw;margin-top:3cqw;align-self:center}
.paper.map{--pimg:url("img/paper_map.webp");width:min(94cqw,86cqh * 1.6);aspect-ratio:1500/938;transform:rotate(.5deg)}
.paper.map svg{position:absolute;inset:0;width:100%;height:100%}
.paper.map .route{fill:none;stroke:#7a1e12;stroke-width:7;stroke-linecap:round;stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 3s ease-in-out .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.paper.map .pin{fill:#7a1e12}
.paper.map .here{fill:none;stroke:#7a1e12;stroke-width:5}
.paper.map .lbl{font-family:var(--hand);fill:#3a230d;font-size:46px}
.paper.map .lbl.q{fill:#6b5232;opacity:.75}
.paper.map .txt{position:absolute;left:46%;top:6%;width:50%}
.paper.map h3{margin:0 0 .8cqw;font-size:5.2cqw;font-weight:400;line-height:1}
.paper.map p{font-size:2.9cqw;line-height:1.25}
.paper.map .go{font-size:3.3cqw;margin-top:1.6cqw}
.paper.book{--pimg:url("img/paper_ledger.webp");width:min(94cqw,88cqh * 1.6);aspect-ratio:1500/938;color:#1f2a44}
.paper.book .pg{position:absolute;top:15%;width:33%}
.paper.book .pg.l{left:11%}.paper.book .pg.r{left:56%}
.paper.book h4{margin:0 0 .7cqw;font-size:4.1cqw;font-weight:400;line-height:1.05}
.paper.book p{font-size:3.2cqw;line-height:1.3;margin-bottom:.5cqw}
.paper.book table{width:100%;margin:1cqw 0 0;font-size:3.3cqw}
.paper.book td,.paper.book th{border:0;border-bottom:.25cqw solid rgba(31,42,68,.45);padding:.5cqw .4cqw;font-weight:400}
.paper.book .ink{position:absolute;inset:0}
.paper.book .ink.blur{filter:blur(.55cqw);opacity:.7}
.paper.book .ink.sharp{clip-path:circle(0 at 8% 40%);animation:lens 3s ease-in-out .4s forwards}
@keyframes lens{0%{clip-path:circle(9% at 8% 40%)}70%{clip-path:circle(9% at 92% 45%)}100%{clip-path:circle(150% at 50% 50%)}}
.paper.parch{--pimg:url("img/paper_letter.webp");--pw:min(64cqw,92cqh * .79);width:var(--pw);aspect-ratio:633/800;padding:calc(var(--pw) * .12) calc(var(--pw) * .12) calc(var(--pw) * .1) calc(var(--pw) * .13);transform:rotate(-.8deg)}
.paper.parch h3{margin:0 0 2cqw;font-size:11.2cqw;font-weight:400;line-height:1}
.paper.parch .d{font-size:7.2cqw;margin-bottom:2.6cqw}
.paper.parch .rule{font-size:6.2cqw;line-height:1.28}
.paper.parch .rule b{font-weight:400;text-decoration:underline;text-decoration-thickness:.35cqw}
.paper.parch table{width:94%;margin:4cqw auto 0;font-size:7.6cqw}
.paper.parch td{border:0;border-bottom:.4cqw solid rgba(43,28,12,.5);padding:.8cqw 1.3cqw}
.paper.parch td:first-child{letter-spacing:1.9cqw;width:40%;border-right:.4cqw solid rgba(43,28,12,.5)}
.paper.tagz{--pimg:url("img/paper_tag.webp");--pw:min(56cqw,120cqh);width:var(--pw);padding:calc(var(--pw) * .05) calc(var(--pw) * .06) calc(var(--pw) * .04);text-align:center;transform:rotate(1.5deg)}
.paper.tagz .lab{font-size:9cqw;line-height:1;margin-bottom:2cqw}
.paper.tagz svg{display:block;width:100%;height:auto;mix-blend-mode:multiply}

.tag{position:absolute;z-index:0;width:6.1cqw;padding:.35cqw .35cqw .2cqw;background:#e9dcb8 url("img/paper_tag.webp") center/300% auto;border-radius:2px;box-shadow:0 .2cqw .4cqw rgba(0,0,0,.65);text-align:center;color:#3a2a14;font-family:var(--hand);font-size:1.25cqw;line-height:1;pointer-events:none;filter:brightness(.82) sepia(.15)}
.tag svg{display:block;width:100%;height:auto;mix-blend-mode:multiply;margin-top:.15cqw}

.plate{position:relative;width:min(66cqh,74cqw);aspect-ratio:1;background:url("img/magic_plate.webp") center/100% 100%;border-radius:8px;box-shadow:0 26px 70px rgba(0,0,0,.85);cursor:default}
.plate .cell{position:absolute;width:20.3%;height:20.3%;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;border-radius:6px}
.plate .cell:hover:not(.fixed){box-shadow:inset 0 0 0 3px rgba(255,214,120,.45)}
.plate svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.plate line{stroke:#ffd45a;stroke-width:9;stroke-linecap:round;opacity:.45;filter:drop-shadow(0 0 6px #ffcf57)}
.chip{display:flex;align-items:center;justify-content:center;width:86%;height:86%;border-radius:8px;background:linear-gradient(145deg,#d9b36a,#8c6326 55%,#5b3d15);box-shadow:inset 0 2px 2px rgba(255,240,200,.6),inset 0 -3px 4px rgba(0,0,0,.5),0 4px 8px rgba(0,0,0,.6);font:700 calc(min(66cqh,74cqw) * .12)/1 "Times New Roman",serif;color:#2c1a06;text-shadow:0 1px 0 rgba(255,235,190,.55)}
.chip.fixed{background:linear-gradient(145deg,#b58e4c,#6e4c1c 55%,#46300f)}
.plate.won .chip{box-shadow:0 0 18px #ffd45a,inset 0 2px 2px rgba(255,240,200,.6)}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:2.2cqh;min-height:calc(min(66cqh,74cqw) * .13);cursor:default}
.tray .chip{width:calc(min(66cqh,74cqw) * .13);height:calc(min(66cqh,74cqw) * .13);font-size:calc(min(66cqh,74cqw) * .08);border:0;cursor:pointer}
.tray .chip.sel{outline:3px solid #ffe6a0;box-shadow:0 0 16px #ffd45a}
.platemsg{min-height:1.6em;margin:1.2cqh 0 0;text-align:center;font-size:17px;color:#f3ecdd;text-shadow:0 1px 4px #000}
.platewrap{display:flex;flex-direction:column;align-items:center;cursor:default}
.platewrap .btn{margin-top:1.2cqh}
.travel{position:fixed;inset:0;z-index:20;background:#000;overflow:hidden;cursor:pointer}
.travel .from,.travel .to{position:absolute;left:50%;top:50%;width:var(--sw);height:var(--sh);margin:calc(var(--sh) / -2) 0 0 calc(var(--sw) / -2)}
.travel .stage{container-type:size;overflow:hidden}
.travel .from{animation:goIn 2s cubic-bezier(.55,0,.8,.6) both}
.travel .from>*{position:absolute}
.travel .from>img:first-child{inset:0;width:100%;height:100%}
@keyframes goIn{0%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(3.2)}}
.travel .to{opacity:0;animation:arrive 2.2s ease-out 1.7s both}
@keyframes arrive{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:scale(1)}}
.travel p{position:absolute;left:0;right:0;bottom:9%;margin:0;text-align:center;font-family:var(--hand);font-size:clamp(30px,5vw,56px);color:#ffe6a8;text-shadow:0 3px 12px #000;animation:cap 2s ease-out 1.8s both}
.travel small{position:absolute;right:16px;bottom:12px;color:#cfc8b8;opacity:.7}
@keyframes cap{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.endscr{position:fixed;inset:0;z-index:8;background:#000;overflow:hidden;container-type:size}
.endscr>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:73% 52%;animation:dawn 12s ease-out both}
@keyframes dawn{0%{opacity:0;filter:brightness(2.6)}18%{opacity:1;filter:brightness(1.6)}34%{filter:brightness(1)}100%{opacity:1;transform:scale(1.12)}}
.endscr h2{position:absolute;top:3cqh;left:0;right:0;margin:0;text-align:center;font-family:var(--hand);font-weight:400;font-size:clamp(44px,10cqh,110px);color:#fff4d2;text-shadow:0 3px 16px #3a1c00;animation:cap 1.4s ease-out 2.6s both}
.endscr .paper.letter{position:absolute;left:50%;top:54%;--pw:min(46cqw,72cqh * .79);transform:translate(-50%,-50%) rotate(.8deg);animation:fade2 1.2s ease-out 5s both;justify-content:center}
.endscr .paper.letter p{font-size:7.3cqw}
.endscr .paper.letter .ps{font-size:6.4cqw;margin-top:3cqw}
.endscr .paper.letter .sign{text-align:right}
@keyframes fade2{from{opacity:0}to{opacity:1}}
.endscr .paper.letter.folded{display:none}
.endscr .row{position:absolute;left:0;right:0;bottom:2.4cqh;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;animation:fade2 1s ease-out 6s both}
.endscr .row .btn{background:rgba(10,10,12,.6);border-color:rgba(255,255,255,.3);backdrop-filter:blur(3px)}

const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
function ean8(code){
  const right=d=>[...EAN_L[d]].map(c=>c==='1'?'0':'1').join('');
  const bits='101'+[...code.slice(0,4)].map(d=>EAN_L[d]).join('')+'01010'+[...code.slice(4)].map(right).join('')+'101';
  const guard=new Set([0,1,2,31,32,33,34,35,64,65,66]),q=7,H=26;let r='';
  for(let i=0;i<67;i++)if(bits[i]==='1')r+='<rect x="'+(q+i)+'" y="0" width="1" height="'+(guard.has(i)?H+5:H)+'"/>';
  const tx=(s,x)=>'<text x="'+x+'" y="'+(H+11)+'" font-size="10" text-anchor="middle" font-family="Consolas,monospace" letter-spacing="1.4">'+s+'</text>';
  return '<svg viewBox="0 0 81 39" fill="#1a130a" role="img" aria-label="바코드 '+code+'" data-bits="'+bits+'">'+r+tx(code.slice(0,4),q+17.5)+tx(code.slice(4),q+50.5)+'</svg>';
}

  });
}

function renderRoom(){

  const order=R.hot.slice().sort((a,b)=>area(b)-area(a));

const HINT_MS=180000,HINT_WRONG=2;
function hintKey(){return S.room==='v'&&f.open?'v2':S.room;}
function hintList(k){return k==='v2'?ROOMS.v.after:ROOMS[k].hints;}
function hintBegin(k){S.hs=S.hs||{};if(!S.hs[k])S.hs[k]={t:Date.now(),w:[]};}
function hintInfo(){
  const k=hintKey(),H=S.hs&&S.hs[k];if(!H)return null;
  const list=hintList(k),now=Date.now();let from=H.t,lv=0,next=null,left=HINT_WRONG;
  while(lv<list.length){
    const w=H.w.filter(x=>x>from),at=Math.min(from+HINT_MS,w.length>=HINT_WRONG?w[HINT_WRONG-1]:Infinity);
    if(at<=now){lv++;from=at;}else{next=at;left=HINT_WRONG-w.length;break;}
  }
  return {k,list,lv,next,left};
}
function clock(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

const LOCKS={
  door:{img:'img/lock_door.jpg',view:[230,30,1300,950],y:[296,694],x:[[410,815],[944,1350]]},
  hatch:{img:'img/lock_hatch.jpg',view:[0,0,1536,1024],y:[314,740],x:[[276,722],[784,1228]]},

};
function lockWidget(name,val){
  const L=LOCKS[name],NS='http://www.w3.org/2000/svg';
  const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const box=h('div','lock');box.dataset.lock=name;
  const svg=el('svg',{viewBox:L.view.join(' ')});svg.append(el('image',{href:L.img,width:1536,height:1024}));
  const texts=[];let locked=false;
  const turn=(i,d)=>{
    if(locked)return;val[i]=(val[i]+d+10)%10;const t=texts[i];t.textContent=val[i];box.classList.remove('shake');
    t.classList.remove('roll');t.style.setProperty('--from',(d*60)+'px');t.getBoundingClientRect();t.classList.add('roll');
  };
  L.x.forEach(([x1,x2],i)=>{
    const [y1,y2]=L.y,cx=(x1+x2)/2,cy=(y1+y2)/2,w=x2-x1,ht=y2-y1;
    const t=el('text',{x:cx,y:cy,class:'digit','font-size':Math.min(ht*.5,w*.9)});t.textContent=val[i];texts.push(t);svg.append(t);
    [[1,y1],[-1,cy]].forEach(([d,top])=>{
      const z=el('g',{class:'wheel',role:'button',tabindex:0,'data-i':i,'data-d':d,'aria-label':(i+1)+'번째 칸 '+(d>0?'올리기':'내리기')});
      const a=Math.min(w*.16,26),ay=d>0?y1+a*1.1:y2-a*1.1;
      z.append(el('rect',{x:x1,y:top,width:w,height:ht/2,class:'zone'}),el('path',{class:'arrow',d:'M'+(cx-a)+' '+(ay+d*a*.45)+'L'+cx+' '+(ay-d*a*.45)+'L'+(cx+a)+' '+(ay+d*a*.45)+'Z'}));
      z.addEventListener('click',()=>turn(i,d));
      z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();turn(i,d);}});
      svg.append(z);
    });
  });
  box.append(svg);
  return {el:box,
    value:()=>val.join(''),
    set(v){[...v].forEach((c,i)=>{val[i]=+c;texts[i].textContent=c;});box.classList.remove('shake');},
    shake(){box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');},
    win(){locked=true;box.classList.add('won');}
  };
}

const TILE_FROM={cookie:[4,9],book:[2,7],portrait:[3,6]};
function tilesLeft(){const b=f.board||GIVEN;return (f.found||[]).filter(n=>!b.includes(n));}

const CELL_X=[16.3,39.9,63.4],CELL_Y=[15.6,38.7,61.6];
function magicPop(){
  if(f.open){say('금고는 이미 열렸다.');return;}
  f.board=f.board||GIVEN.slice();
  const ov=h('div','sheet'),wrap=h('div','platewrap');ov.append(wrap);document.body.append(ov);
  const close=()=>{ov.remove();renderBag();};
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
  const plate=h('div','plate'),tray=h('div','tray'),msg=h('p','platemsg',''),x=h('button','btn','닫기');x.onclick=close;
  wrap.append(plate,tray,msg,x);
  let pick=0,done=false;
  const draw=()=>{
    const b=f.board,good=LINES.filter(l=>l.every(i=>b[i])&&b[l[0]]+b[l[1]]+b[l[2]]===15),won=good.length===LINES.length;
    plate.textContent='';plate.classList.toggle('won',won);
    b.forEach((v,i)=>{
      const c=h('button','cell'+(GIVEN[i]?' fixed':''));c.dataset.i=i;
      c.style.left=CELL_X[i%3]+'%';c.style.top=CELL_Y[Math.floor(i/3)]+'%';
      c.setAttribute('aria-label',(Math.floor(i/3)+1)+'행 '+(i%3+1)+'열 '+(v||'빈 홈'));
      if(v)c.append(h('span','chip'+(GIVEN[i]?' fixed':''),String(v)));
      c.onclick=()=>place(i);plate.append(c);
    });

    const at=i=>[CELL_X[i%3]+10.2,CELL_Y[Math.floor(i/3)]+10.2];
    let s='<svg viewBox="0 0 100 100" preserveAspectRatio="none">';
    if(!won)good.forEach(l=>{const [x1,y1]=at(l[0]),[x2,y2]=at(l[2]),ex=Math.sign(x2-x1)*9,ey=Math.sign(y2-y1)*9;s+='<line x1="'+(x1-ex)+'" y1="'+(y1-ey)+'" x2="'+(x2+ex)+'" y2="'+(y2+ey)+'" style="stroke-width:1.1"/>';});
    plate.insertAdjacentHTML('beforeend',s+'</svg>');
    tray.textContent='';
    tilesLeft().sort((a,c)=>a-c).forEach(n=>{const t=h('button','chip'+(pick===n?' sel':''),String(n));t.dataset.n=n;t.onclick=()=>{pick=pick===n?0:n;draw();};tray.append(t);});
    if(!done&&!msg.textContent&&!(f.found||[]).length)msg.textContent='빈 홈이 여섯 개다. 맞는 숫자 조각을 찾아야 한다.';
  };
  const place=i=>{
    if(done||GIVEN[i])return;
    const b=f.board;msg.textContent='';msg.className='platemsg';
    if(pick){b[i]=pick;pick=0;}
    else if(b[i])b[i]=0;
    else{msg.textContent=tilesLeft().length?'아래에서 숫자 조각을 먼저 고르자.':'끼울 숫자 조각이 없다. 방 안을 더 찾아보자.';draw();return;}
    draw();
    if(!b.every(Boolean))return;
    if(LINES.every(l=>b[l[0]]+b[l[1]]+b[l[2]]===15)){
      done=true;f.open=1;take('tiles');msg.textContent='찰칵. 모든 줄에 불이 들어왔다.';msg.className='platemsg ok';
      setTimeout(()=>{close();openVault();},1500);
    }else{miss();plate.classList.remove('shake');void plate.offsetWidth;plate.classList.add('shake');msg.textContent='덜컹. 숫자판이 움직이지 않는다. 끼운 조각을 누르면 뺄 수 있다.';msg.className='platemsg bad';}
  };
  draw();
}

      {i:'🪟',id:'crack',n:'창틀 틈새',fn(){if(f.crack){say('더 나올 것이 없다.');return;}f.crack=1;give('card2');say('창틀 틈새에서 “2”라고 적힌 카드를 찾았다.');}},
      {i:'🪜',id:'rail',n:'계단 난간 구석',fn(){if(f.rail){say('더 나올 것이 없다.');return;}f.rail=1;give('card4');say('난간 구석에서 “4”라고 적힌 카드를 찾았다.');}},
      {i:'⚡',id:'fusebox',n:'벽면 배전반',fn(){
        if(f.power){say('전원이 들어와 있다.');return;}
        if(!f.gloves){
          if(S.sel==='gloves'){f.gloves=1;take('gloves');say('장갑을 끼고 배전반 문을 열었다. 빈 퓨즈 자리와 레버 자리가 보인다.');return;}
          say('전선이 드러나 있다. 맨손으로 만지면 위험하다.');return;}
        if(S.sel==='fuse'){f.fuse=1;take('fuse');say('퓨즈를 끼우자 파직, 불꽃이 튀었다.');return;}
        if(S.sel==='lever'){
          if(!f.fuse){say('레버를 끼우기 전에 빈 퓨즈 자리부터 채워야 할 것 같다.');return;}
          f.power=1;take('lever');say('레버를 끼워 올리자 제어판에 희미한 불이 들어왔다.');return;}
        say(f.fuse?'퓨즈는 끼웠다. 레버 자리가 비어 있다.':'배전반 안에 퓨즈 자리와 레버 자리가 비어 있다.');}},
      {i:'🎛️',id:'panel',n:'제어판',fn(){
        if(S.sel==='card2'||S.sel==='card4'){
          const n=S.sel==='card2'?2:4;S.mount[n-1]=true;take('card'+n);say('제어판의 '+n+'번 자리에 카드를 꽂았다.');return;}
        if(!f.power){say('제어판은 먹통이다. 전원이 들어오지 않는다.');return;}
        panelPop();}},
      {i:'⏲️',id:'gauge',n:'압력 게이지',fn(){say('바늘이 0에 멈춰 있다.');}},
      {i:'🔭',id:'lens',n:'거대한 렌즈',fn(){say('먼지 낀 거대한 렌즈다. 불이 켜지면 바다 멀리까지 빛을 보낼 것이다.');}},
      {i:'🧭',id:'compass',n:'고장 난 나침반',fn(){say('바늘이 빙글빙글 돈다. 제어판 근처에 전류가 흐르는 듯하다.');}},
      {i:'🗺️',id:'map',n:'벽면 섬 지도',fn(){say('섬 지도다. 부두 쪽에 낡은 창고가 그려져 있다.');}},
      {i:'🌊',id:'sea',n:'폭풍 속 바다',fn(){say('파도가 거세다. 창은 굳게 닫혀 있다.');}}
    ]},
  r3:{title:'방 3 · 부두 창고',goal:'가짜 상자를 찾아 해치를 열어라.',
    introTitle:'부두 창고',intro:['새벽 안개가 낮게 깔린 부두. 낡은 창고 안에 상자 다섯 개가 놓여 있다.','그 가운데 하나는 등대지기가 몰래 섞어 둔 가짜다.'],introBtn:'주위를 둘러본다',
    hints:['가방에서 돋보기를 고른 뒤 번진 장부를 눌러 보자. 바코드 다섯 개는 모둠이 나눠 계산하자.','앞 일곱 자리에 3, 1, 3, 1, 3, 1, 3을 곱해 더하면 마지막 자리가 정해진다. 합은 10의 배수가 되어야 한다.','2번 상자만 맞지 않는다. 해치에는 가짜 상자의 번호와 올바른 마지막 자리를 이어 쓴다.'],
    hot:[
      {i:'📖',id:'ledger',n:'관리 데스크 장부',fn(){ledger3();}},
      {i:'🧰',id:'shelf',n:'선반 위 도구함',fn(){if(f.shelf){say('더 나올 것이 없다.');return;}f.shelf=1;give('crowbar');say('녹슨 쇠지렛대가 들어 있다.');}},
      crateHot(1),crateHot(2),crateHot(3),crateHot(4),crateHot(5),
      {i:'🕳️',id:'hatch',n:'바닥 철제 해치',fn(){hatchPop();}},
      {i:'🕸️',id:'nets',n:'찢어진 어망',fn(){say('비린내가 진동한다. 마른 조개껍데기뿐이다.');}},
      {i:'🚜',id:'forklift',n:'녹슨 지게차',fn(){say('시동 키가 뽑혀 있고 바퀴에 바람이 빠져 있다.');}},
      {i:'⛵',id:'boat',n:'묶인 나룻배',fn(){say('노가 부러져 있어 타고 나갈 수 없다.');}},
      {i:'🏮',id:'barrel',n:'통 위의 등불',fn(){say('등불이 흔들린다. 통 뚜껑에는 분필 자국이 있다.');}}
    ]},
  v:{title:'금고 · 등대지기의 방',goal:'금고를 열어라.',
    introTitle:'등대지기의 방',intro:['작은 방 한가운데 무쇠 금고가 웅크리고 있다.','금고 문의 청동 숫자판에는 빈 홈이 여섯 개 있다.','맞는 숫자 조각이 이 방 어딘가에 숨겨져 있을 것이다.'],introBtn:'주위를 둘러본다',
    after:['금고 속 양피지를 눌러 보자. 아웃으로 나온 숫자부터 모두 지우자.','같은 숫자가 나온 두 줄을 비교하면 그 숫자의 자리를 좁힐 수 있다.','첫째 암호 세 자리 뒤에 둘째 암호 세 자리를 이어 상자에 넣는다.'],
    hints:['금고 문을 눌러 숫자판을 살펴보자. 빈 홈에 끼울 숫자 조각은 방 안 곳곳에 숨어 있다. 쿠키 상자부터 보자.','찾은 물건은 가방에서 고른 뒤 쓸 곳을 누른다. 작은 열쇠는 책장의 잠긴 책에, 렌즈는 창턱의 망원경에 쓴다.','1부터 9까지를 모두 더하면 45다. 가로줄이 셋이니 한 줄의 합은 15다. 두 칸이 채워진 줄부터 남은 수를 구하자.'],
    hot:[
      {i:'🔒',id:'ring',n:'금고 문',fn(){magicPop();}},
      {i:'🖼️',id:'portrait',n:'등대지기 초상화',fn(){
        if(f.portrait){say('액자 뒤 홈은 비어 있다.');return;}
        if(!f.scope){say('온화한 미소의 노인 초상화다. 빵집 할머니와 어딘가 닮았다.');return;}
        f.portrait=1;giveTiles('portrait');say('망원경으로 본 틈을 당기자 액자가 열렸다. 벽의 작은 홈에서 숫자 조각 두 개가 나왔다.');}},
      {i:'🍪',id:'cookiebox',n:'쿠키 상자',fn(){
        if(f.cookie){say('쿠키 상자 바닥의 숨은 칸은 비어 있다.');return;}
        f.cookie=1;giveTiles('cookie');give('skey');say('체험학습 첫날 받았던 쿠키 상자와 같은 상자다. 들뜬 바닥 판을 들어 올리자 숨은 칸에서 숫자 조각 두 개와 작은 열쇠가 나왔다.');}},
      {i:'📚',id:'books',n:'책장의 잠긴 책',fn(){
        if(f.book){say('속이 파인 책이다. 이제 비어 있다.');return;}
        if(S.sel!=='skey'){say('책장 가운데 두꺼운 가죽 책 한 권에 작은 놋쇠 자물쇠가 채워져 있다.');return;}
        f.book=1;take('skey');giveTiles('book');give('glass');say('작은 열쇠로 자물쇠를 풀고 책을 펼치자, 속이 파인 칸에 숫자 조각 두 개와 작은 렌즈가 들어 있다.');}},
      {i:'🧭',id:'sextant',n:'황동 육분의',fn(){say('별의 높이를 재어 배의 위치를 찾는 도구다.');}},
      {i:'🔭',id:'spyglass',n:'창턱의 망원경',fn(){
        if(f.scope){say('망원경 너머로 맞은편 초상화 액자 가장자리의 틈이 보인다.');return;}
        if(S.sel!=='glass'){say('창턱의 망원경이다. 앞쪽 렌즈가 빠져 있다.');return;}
        f.scope=1;take('glass');say('렌즈를 끼우고 망원경을 들여다보았다. 맞은편 초상화 액자 가장자리에 가는 틈이 보인다.');}}
    ]}
};

const SAVE_KEY='lighthouse.v1';
const PLAYER={on:false,group:1,member:null};
function readSave(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));return d&&d.S&&d.S.room&&ROOMS[d.S.room]?d:null;}catch(e){return null;}}
function writeSave(){
  if(!PLAYER.on||!S.t0[S.room])return;
  const copy=Object.assign({},S);delete copy.flash;delete copy.solving;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({group:PLAYER.group,member:PLAYER.member,S:copy,f:f}));}catch(e){}
}
function clearSave(){PLAYER.on=false;try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function showWho(){
  if(!PLAYER.on){$('#who').textContent='';return;}
  const sec=Math.max(0,Math.floor(((S.t1.v||Date.now())-S.started)/1000));
  $('#who').textContent=PLAYER.group+'조 · '+PLAYER.member+'번 · '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}
setInterval(()=>{showWho();writeSave();if(PLAYER.on)paintHint();},1000);
addEventListener('resize',layout);layout();
window.addEventListener('pagehide',writeSave);

function goFull(){
  try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen({navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{});}catch(e){}
}
function newGame(){
  newState();PLAYER.on=true;showWho();
  story(INTRO.title,INTRO.lines,'눈을 뜬다',()=>{S.started=Date.now();startRoom('r1',[]);});
}
function resumeGame(d){
  newState();Object.assign(S,d.S);S.flash={};S.solving=null;f=d.f||{};PLAYER.on=true;showWho();
  renderRoom();say('하던 곳에서 이어서 한다.');
  if(S.room==='v'){if(S.t1.v||f.done){f.done=1;finish();}else if(f.open){const r=$('#scene .hot[data-id="ring"]');if(r)r.remove();addSafeHots();}}
}
function showTitle(){
  const t=h('div');t.id='title';const box=h('div','in');t.append(box);
  box.append(h('h1','','🏮 등대지기의 시험'),h('p','','낯선 등대에서 눈을 떴다. 모둠 친구들과 함께 단서를 찾고, 문제를 풀어 이곳을 탈출하라.'));
  const enter=fn=>{goFull();t.remove();fn();};
  const saved=readSave();
  if(saved){
    box.append(h('p','q','이전에 하던 기록이 있다.'),h('p','mut',saved.group+'조 '+saved.member+'번 · '+ROOMS[saved.S.room].title));
    const go=h('button','btn gold go','이어서 하기'),re=h('button','btn go','새로 시작');
    go.onclick=()=>{PLAYER.group=saved.group;PLAYER.member=saved.member;enter(()=>resumeGame(saved));};
    re.onclick=resetPop;
    const r=h('div','pick');r.append(go,re);box.append(r);
  }else{
    const start=h('button','btn gold go','내 번호를 고르세요');start.disabled=true;
    const row=(label,count,suffix,onPick,first)=>{
      box.append(h('div','q',label));const r=h('div','pick');
      for(let i=1;i<=count;i++){
        const b=h('button',i===first?'on':'',i+suffix);b.type='button';
        b.onclick=()=>{[...r.children].forEach(x=>x.classList.toggle('on',x===b));onPick(i);};r.append(b);
      }
      box.append(r);
    };
    PLAYER.group=1;PLAYER.member=null;
    row('1. 우리 모둠(조)을 고르세요',6,'조',i=>{PLAYER.group=i;},1);
    row('2. 모둠에서 내 번호를 고르세요',4,'',i=>{PLAYER.member=i;start.disabled=false;start.textContent='게임 시작';});
    start.onclick=()=>{if(PLAYER.member)enter(newGame);};
    box.append(start);
  }
  box.append(h('p','note','시작하면 전체 화면으로 바뀝니다. 나오려면 Esc 키를 누르세요.'));
  document.body.append(t);
}
newState();
showTitle();
</script>
