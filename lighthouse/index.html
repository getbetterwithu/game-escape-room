<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>등대지기의 시험</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--tile:#2a2e36;--tile-h:#3a404c;--text:#ebe8e0;--mut:#9aa0ab;--gold:#e0b862;--bad:#f08a7c;--ok:#8fd4a0;--line:#3a3f49}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:0 16px 40px}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:14px 0 8px}
.top h1{font-size:18px;margin:0;color:var(--gold)}
.goal{color:var(--mut);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:44px}
.btn:hover{background:var(--tile-h)}
.btn.gold{background:#7a5c1e;border-color:#a8822f}
.btn:disabled{opacity:.45;cursor:default}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}
.slot{aspect-ratio:1.25;min-height:56px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;text-align:center;padding:2px}
.slot small{font-size:11px;color:var(--mut);line-height:1.2}
.slot.sel{outline:3px solid var(--gold);outline-offset:1px;background:#5a4a1e;box-shadow:0 0 14px rgba(224,184,98,.75)}
.slot.sel small{color:#fff;font-weight:700}
.slot.sel small::before{content:"✔ "}
.slot.empty{cursor:default;opacity:.5}
.stage{position:relative;width:100%;max-width:1100px;aspect-ratio:1672/933;margin:8px auto 0;background:#0e1013;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.stage .hot{position:absolute;padding:0;margin:0;background:transparent;border:2px solid transparent;border-radius:4px;-webkit-tap-highlight-color:transparent}
.stage .hot:hover,.stage .hot:focus-visible{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.85);outline:none}
.say{white-space:pre-line;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px;margin-top:12px;min-height:56px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.box h4{margin:0 0 6px;font-size:13px;color:var(--gold)}
.box p{margin:3px 0;color:var(--text)}
.mut{color:var(--mut)}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}
.pn{background:#1b1e24;border:1px solid #4a505c;border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.pn h3{margin:0 0 6px;color:var(--gold);font-size:18px}
.pn p{margin:6px 0}
.pn .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.pn input[type=text],.pn input[type=number]{background:#0f1115;color:var(--text);border:1px solid #555c69;border-radius:8px;padding:10px;font:inherit;width:120px;min-height:44px;text-align:center}
.dial{display:flex;gap:18px;justify-content:center;margin:14px 0}
.dcol{display:flex;flex-direction:column;gap:6px;align-items:center}
.dnum{font-size:40px;font-weight:700;color:var(--gold);width:70px;text-align:center;background:#0f1115;border:1px solid #555c69;border-radius:10px}
.bubble{position:absolute;transform:translateX(-50%);width:17%;min-width:128px;background:#f6f1e4;color:#1c1a16;border-radius:10px;padding:5px 8px;font-size:12.5px;line-height:1.4;box-shadow:0 3px 12px rgba(0,0,0,.55);pointer-events:none;z-index:2;word-break:keep-all}
.bubble b{display:block;font-size:11px;color:#7a5c1e}
.bubble::before{content:"";position:absolute;left:50%;top:-6px;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#f6f1e4}
table{border-collapse:collapse;width:100%;margin:8px 0}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:center}
.lamps{display:flex;gap:10px;justify-content:center;margin:10px 0}
.lamp{width:52px;height:52px;border-radius:50%;background:#15171b;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-weight:700;color:#555}
.lamp.on{background:#f4d58a;color:#2a1f00;border-color:#fff2c4;box-shadow:0 0 18px #f4d58a}
.cardrow{display:grid;grid-template-columns:72px 1fr 40px;gap:10px;align-items:center;margin:8px 0}
.card{min-height:60px;text-align:left;background:#0f1115;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;word-break:keep-all}
.card.wide{grid-column:1 / 3}
.card.on{border-color:#f4d58a;background:#2d2a1e}
.card:disabled{cursor:default;opacity:.6}
.fig{height:60px;padding:2px;background:#fff;color:#111;border:2px solid var(--line);border-radius:8px;cursor:zoom-in}
.fig svg{display:block;width:100%;height:100%;fill:#111}
.figbig{background:#fff;color:#111;border-radius:10px;padding:8px}
.figbig svg{display:block;width:100%;max-height:56vh;fill:#111}
.cardrow .lamp{width:40px;height:40px}
.magic{position:relative;display:grid;grid-template-columns:repeat(3,76px);gap:8px;width:244px;margin:18px auto}
.magic svg{position:absolute;inset:0;width:244px;height:244px;overflow:visible;pointer-events:none}
.magic line{stroke:#ffd45a;stroke-width:5;stroke-linecap:round;opacity:.42;filter:drop-shadow(0 0 4px #ffcf57)}
.cell{height:76px;font-size:30px;font-weight:700;background:#0f1115;border:2px solid var(--line);border-radius:10px}
.cell.fixed{cursor:default;color:var(--gold);background:#23211a}
.cell.line{background:#f4d58a;color:#2a1f00;border-color:#fff2c4;box-shadow:0 0 14px #f4d58a}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tile{width:52px;height:52px;font-size:22px;font-weight:700;background:var(--tile);border:2px solid var(--line);border-radius:10px}
.tile.sel{border-color:var(--gold);background:#5a4a1e;box-shadow:0 0 12px rgba(224,184,98,.75)}
.rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rings circle{fill:none;stroke:#ffd978;stroke-width:7;opacity:0;transform-origin:849px 365px;filter:drop-shadow(0 0 9px #ffcf57);animation:ringOn 1s ease-out forwards}
@keyframes ringOn{from{opacity:0;transform:rotate(-120deg)}to{opacity:.75;transform:none}}
.rings.spin circle{opacity:.9;animation:ringSpin 2.2s cubic-bezier(.5,0,.3,1) forwards}
.rings.spin circle:nth-child(2){animation-direction:reverse}
@keyframes ringSpin{from{opacity:.75;transform:none}to{opacity:1;transform:rotate(360deg)}}
.safe{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.safe .inside{animation:safeIn .5s both}
.safe .door{transform-origin:1180px 365px;animation:safeDoor 1.7s cubic-bezier(.5,0,.25,1) .3s both}
@keyframes safeIn{from{opacity:0}to{opacity:1}}
@keyframes safeDoor{to{transform:skewY(-4deg) scaleX(.13)}}
.safe .goods{animation:safeIn .8s 1.4s both}
.safe text{font-family:sans-serif;font-weight:700;text-anchor:middle}
.baseball td{font-size:18px}
.baseball td:first-child{font-size:24px;font-weight:700;letter-spacing:6px}
.pn.lockpn{max-width:720px;background:#14100b;border-color:#6b5026}
.lock{border-radius:12px;overflow:hidden;margin:8px 0}
.lock svg{display:block;width:100%;max-height:54vh;user-select:none}
.lock.won svg{filter:drop-shadow(0 0 14px #ffd45a) brightness(1.12)}
.lock.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lock .digit{font-family:"Times New Roman",serif;font-weight:700;font-variant-numeric:lining-nums;fill:#2c1a06;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lock .wheel{cursor:pointer;outline:none}
.lock .zone{fill:transparent}
.lock .wheel:hover .zone,.lock .wheel:focus-visible .zone{fill:rgba(255,196,84,.2)}
.lock .arrow{fill:#7a5a22;opacity:.6;pointer-events:none}
.lock .roll{animation:roll .22s ease-out}
@keyframes roll{from{transform:translateY(var(--from));opacity:.2}to{transform:none;opacity:1}}
.travel{position:fixed;inset:0;z-index:20;background:#000;overflow:hidden;cursor:pointer}
.travel img{position:absolute;inset:0;margin:auto;width:100%;height:100%;object-fit:contain}
.travel .from{animation:goIn 2s cubic-bezier(.55,0,.8,.6) both}
@keyframes goIn{0%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(3.2)}}
.travel .to{opacity:0;animation:arrive 2.2s ease-out 1.7s both}
@keyframes arrive{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:scale(1)}}
.travel p{position:absolute;left:0;right:0;bottom:9%;margin:0;text-align:center;font-size:clamp(20px,3.4vw,34px);font-weight:700;color:#ffe6a8;text-shadow:0 3px 12px #000;animation:cap 2s ease-out 1.8s both}
.travel small{position:absolute;right:16px;bottom:12px;color:#cfc8b8;opacity:.7}
@keyframes cap{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.endscr{position:fixed;inset:0;z-index:8;background:#000;overflow:hidden}
.endscr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:73% 52%;animation:dawn 12s ease-out both}
@keyframes dawn{0%{opacity:0;filter:brightness(2.6)}18%{opacity:1;filter:brightness(1.6)}34%{filter:brightness(1)}100%{opacity:1;transform:scale(1.12)}}
.endscr h2{position:absolute;top:5%;left:0;right:0;margin:0;text-align:center;font-size:clamp(26px,5vw,52px);color:#fff4d2;text-shadow:0 3px 16px #3a1c00;animation:cap 1.4s ease-out 2.6s both}
.endscr .letter{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:min(640px,92%);background:rgba(243,231,200,.95);color:#2f2210;border-radius:10px;padding:14px 22px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:fade2 1s ease-out 6s both}
@keyframes fade2{from{opacity:0}to{opacity:1}}
.endscr .letter p{margin:6px 0;text-align:center;word-break:keep-all}
.endscr .letter.folded{display:none}
.endscr .row{position:absolute;left:0;right:0;bottom:28px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;animation:fade2 1s ease-out 7s both}
@media(max-width:640px){.cols{grid-template-columns:1fr}}

.fxl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.fxl text{font-family:sans-serif;font-weight:700;text-anchor:middle}
.fxl .fx{display:none}
.fxl .fx.show{display:inline;animation:fxfade .35s both}
@keyframes fxfade{from{opacity:0}to{opacity:1}}
.stage .hot{z-index:1}
.blocker{position:fixed;inset:0;z-index:9}
.fxl.r1 .show .twinkle{animation:r1_twinkle 1.1s ease-in-out 3 both;transform-box:fill-box;transform-origin:center}
@keyframes r1_twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.15)}}
.fxl.r1 .show .rise{animation:r1_rise .9s cubic-bezier(.3,1.4,.5,1) .5s both}
@keyframes r1_rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.fxl.r1 .show .got{animation:r1_got .5s ease-in 2.4s forwards}
@keyframes r1_got{to{opacity:0}}
.fxl.r1 .show .pull{animation:r1_pull .8s cubic-bezier(.3,1.4,.5,1) both}
@keyframes r1_pull{to{transform:translate(0,34px)}}
.fxl.r1 .show .tilt{animation:r1_tilt 1s cubic-bezier(.3,1.6,.5,1) both;transform-origin:759px 118px}
@keyframes r1_tilt{to{transform:rotate(7deg)}}
.fxl.r1 .show .peek{animation:r1_rise .8s .7s both}
.fxl.r1 .show .swing{animation:r1_swing 1s ease-in-out both;transform-origin:1100px 500px}
@keyframes r1_swing{to{transform:skewY(-9deg) scaleX(.2)}}
.fxl.r1 .show .halfL{animation:r1_joinL 1s ease-out both}
.fxl.r1 .show .halfR{animation:r1_joinR 1s ease-out both}
@keyframes r1_joinL{from{transform:translate(-300px,60px) rotate(-8deg)}to{transform:none}}
@keyframes r1_joinR{from{transform:translate(300px,-60px) rotate(9deg)}to{transform:none}}
.fxl.r1 .show .ink{animation:fade .7s 1.1s both}
.fxl.r1 .show .ring{animation:r1_ring 1s ease-out 3 both;transform-origin:393px 407px}
@keyframes r1_ring{from{transform:scale(.5);opacity:1}to{transform:scale(2.2);opacity:0}}
.fxl.r1 .show .doorswing{animation:r1_door 1.8s cubic-bezier(.5,0,.3,1) .2s both;transform-origin:47px 480px}
@keyframes r1_door{to{transform:skewY(5deg) scaleX(.22)}}
.fxl.r1 .show .beamin,.fxl.r1 .show .floorlight{animation:fade 1.6s .7s backwards}
.fxl.r2 [data-fx="fuse"].show .spark{animation:r2_spark .9s ease-out forwards}
.fxl.r2 [data-fx="fuse"].show .filament{animation:r2_flick .25s steps(2) 5}
.fxl.r2 [data-fx="fuse"].show .pilot{animation:r2_flick .4s steps(2) 3;filter:drop-shadow(0 0 10px #66ff8a)}
@keyframes r2_spark{0%{opacity:1}20%{opacity:.1}40%{opacity:1}100%{opacity:0}}
@keyframes r2_flick{50%{opacity:.2}}
.fxl.r2 [data-fx="lever"] .arm{transform-origin:187px 388px;transform:rotate(125deg);transition:transform .6s cubic-bezier(.3,1.6,.5,1) .35s}
.fxl.r2 [data-fx="lever"].up .arm{transform:rotate(0deg)}
.fxl.r2 [data-fx="needle"] .hand{transform-origin:637px 828px;transition:transform 1.4s cubic-bezier(.3,1.4,.5,1) .7s}
.fxl.r2 [data-fx="needle"].up .hand{transform:rotate(180deg)}
.fxl.r2 [data-fx="needle"] .face{transition:opacity .2s}
.fxl.r2 [data-fx="needle"].up .face{opacity:1}
.fxl.r2 .num-on.show{animation:r2_flick .3s steps(2) 3 .8s both}
.fxl.r2 .drop.show{animation:r2_drop .5s ease-out}
@keyframes r2_drop{from{transform:translateY(-40px)}to{transform:none}}
.fxl.r2 .show.drop .shine{animation:r2_shine 1.2s ease-out .4s forwards}
.fxl.r2 .shine{opacity:0}
@keyframes r2_shine{25%{opacity:1}100%{opacity:0}}
.fxl.r2 .dome.show{filter:drop-shadow(0 0 22px #ffd978)}
.fxl.r2 [data-fx="beam"].show .rot{transform-origin:840px 245px;animation:r2_sweep 3.2s ease-in-out infinite alternate}
@keyframes r2_sweep{from{transform:rotate(-9deg) scaleX(.75)}to{transform:rotate(9deg) scaleX(1)}}
.fxl.r2 .show .arm{transform-origin:187px 388px;animation:r2_armUp .6s cubic-bezier(.3,1.6,.5,1) .35s both}
@keyframes r2_armUp{from{transform:rotate(125deg)}to{transform:none}}
.fxl.r2 [data-fx="needle"].show .hand{transform-origin:637px 828px;animation:r2_needleUp 1.4s cubic-bezier(.3,1.4,.5,1) .7s both}
@keyframes r2_needleUp{to{transform:rotate(180deg)}}
.fxl.r2 [data-fx="needle"] .face{opacity:1}
.fxl.r2 .ctext{fill:#3a2a08;font-size:22px}
.fxl.r2 .lb{fill:#e0b862;font-size:20px}
.fxl.r3 .show .twinkle{animation:r3_twinkle 1.1s ease-in-out 3 both;transform-box:fill-box;transform-origin:center}
@keyframes r3_twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.15)}}
.fxl.r3 .show .rise{animation:r3_rise .9s cubic-bezier(.3,1.4,.5,1) .5s both}
@keyframes r3_rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.fxl.r3 .show .got{animation:r3_got .5s ease-in 2.4s forwards}
@keyframes r3_got{to{opacity:0}}
.fxl.r3 .show .lidup{animation:r3_lidup .7s cubic-bezier(.3,1.5,.5,1) both;transform-origin:510px 290px}
@keyframes r3_lidup{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
.fxl.r3 .show .glass{animation:r3_glass .8s cubic-bezier(.3,1.3,.5,1) both;transform-origin:1310px 548px}
@keyframes r3_glass{from{transform:scale(.12)}to{transform:scale(1)}}
.fxl.r3 .show .blur{animation:r3_focus 1.3s .6s both}
@keyframes r3_focus{from{filter:blur(9px)}to{filter:blur(0)}}
.fxl.r3 .show .lidpop{animation:r3_pop 1.1s cubic-bezier(.3,1.3,.5,1) both;transform-origin:647px 476px}
@keyframes r3_pop{15%{transform:translate(0,-5px) rotate(2deg)}30%{transform:none}45%{transform:translate(0,-9px) rotate(4deg)}60%{transform:none}100%{transform:translate(16px,-26px) rotate(17deg)}}
.fxl.r3 .show .burst{animation:r3_burst 1.4s .6s both}
@keyframes r3_burst{0%,100%{opacity:0}35%{opacity:.9}}
.fxl.r3 .show .sheen{animation:r3_sheen 1.7s ease-in-out .5s both}
@keyframes r3_sheen{from{x:430px}to{x:1250px}}
.fxl.r3 .show .drip{animation:r3_drip .5s ease-in both}
.fxl.r3 .show .d2{animation-delay:.25s}
.fxl.r3 .show .d3{animation-delay:.45s}
@keyframes r3_drip{from{transform:translateY(-120px);opacity:0}to{transform:none;opacity:1}}
.fxl.r3 .show .drop{animation:r3_drop .7s cubic-bezier(.4,1.8,.6,1) both}
@keyframes r3_drop{from{transform:translateY(-150px)}to{transform:none}}
.fxl.r3 .show .turn{animation:r3_gone .2s 1.4s forwards}
@keyframes r3_gone{to{opacity:0}}
.fxl.r3 .show .spin{animation:r3_spin 1.4s cubic-bezier(.5,0,.3,1) both}
@keyframes r3_spin{to{transform:rotate(540deg)}}
.fxl.r3 .show .hole{animation:fade .3s 1.4s both}
.fxl.r3 .show .lift{animation:r3_lift 1.1s cubic-bezier(.4,0,.2,1) 1.4s both;transform-origin:728px 704px}
@keyframes r3_lift{from{opacity:1;transform:none}to{opacity:1;transform:translateY(-6px) scaleY(-.55)}}
.fxl.r3 .lift{opacity:0}
.fxl.r3 .show .shaft{animation:fade 1.4s 2s both}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🏮 등대지기의 시험</h1>
    <div><span id="place" class="goal"></span></div>
  </div>
  <div class="goal" id="goal"></div>
  <div class="bag" id="bag"></div>
  <div class="stage" id="scene"></div>
  <div class="say" id="say" aria-live="polite">...</div>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="hintBtn">💡 힌트</button>
    <span id="hintTxt" class="mut" style="align-self:center;font-size:14px"></span>
  </div>
  <div class="cols">
    <div class="box" id="notes"><h4>기록</h4><p class="mut">아직 없음</p></div>
    <div class="box" id="side"></div>
  </div>
</div>

<script>
'use strict';
const ITEMS={
  handle:{i:'🔩',n:'놋 손잡이',d:'서랍에 끼울 수 있을 듯한 작은 놋 손잡이.'},
  key:{i:'🗝️',n:'낡은 열쇠',d:'낡은 열쇠다. 어디에 쓸까?'},
  noteL:{i:'📄',n:'찢긴 쪽지 왼쪽',d:'찢긴 쪽지의 왼쪽 반이다. 나머지 반이 어딘가 있을 것이다.'},
  noteR:{i:'📄',n:'찢긴 쪽지 오른쪽',d:'찢긴 쪽지의 오른쪽 반이다. 나머지 반이 어딘가 있을 것이다.'},
  note:{i:'📜',n:'완성된 쪽지',d:'쪽지: “셋 중 진실을 말하는 이는 딱 한 명.\n진실한 자의 근무 일수에서 거짓말쟁이들의 벌점을 빼고, 그 수만큼 자물쇠를 올려라.”'},
  flash:{i:'🔦',n:'손전등',d:'묵직한 손전등이다. 어두운 곳을 비출 수 있겠다.'},
  fuse:{i:'🔌',n:'유리관 퓨즈',d:'먼지 낀 유리관 퓨즈다. 어딘가의 빈 퓨즈 자리에 맞겠다.'},

function fxActive(){
  const on=new Set(Object.keys(S.flash||{}));
  const add=(c,...ids)=>{if(c)ids.forEach(i=>on.add(i));};
  const done=S.solving===S.room;
  if(S.room==='r1'){
    add(f.handle&&has('handle'),'lamp');add(f.drawer,'drawer');add(f.locker,'locker');add(f.frame,'frame');
    add(f.padopen&&!done,'padopen');add(done,'open');
  }
  if(S.room==='r2'){
    add(true,'card0','card2','card4');
    add(!S.mount[1],'empty1');add(!S.mount[3],'empty3');add(S.mount[1],'card1');add(S.mount[3],'card3');
    add(f.gloves,'box');add(f.fuse,'fuse');add(f.power,'lever','needle','num0','num1','num2','num3','num4');
    add(done,'dome2','dome3','beam');
  }
  if(S.room==='r3'){
    add(f.shelf,'tool');add(f.crate2,'crate');add(f.oiled&&!done,'oil');add(f.valved&&!done,'valve');add(done,'open');
  }
  return on;
}
function syncFx(){
  const on=fxActive();
  document.querySelectorAll('#scene .fxl [data-fx]').forEach(e=>e.classList.toggle('show',on.has(e.dataset.fx)));
  const t=document.querySelectorAll('#scene .fxl [data-fx="padopen"] text');
  t.forEach((e,i)=>e.textContent=S.dial[i]);
}
function flashFx(id,ms){
  const state=S;S.flash=S.flash||{};clearTimeout(S.flash[id]);
  S.flash[id]=setTimeout(()=>{if(state!==S||!S.flash)return;delete S.flash[id];syncFx();},ms);
  syncFx();
}

function watch(ms,next){
  const b=h('div','blocker');document.body.append(b);
  $('#scene').scrollIntoView({block:'center'});
  setTimeout(()=>{b.remove();next();},ms);
}

function renderRoom(){
  const R=ROOMS[S.room];
  $('#place').textContent=R.title;

  const sc=$('#scene');sc.textContent='';
  const img=h('img');img.src=BG[S.room];img.alt='';img.draggable=false;sc.append(img);
  if(FX[S.room])sc.insertAdjacentHTML('beforeend',FX[S.room]);
  const C=COORDS[S.room];
  const area=x=>C[x.id].w*C[x.id].h;
  const order=R.hot.slice().sort((a,b)=>area(b)-area(a));
  if(S.room==='r1'){const wi=order.findIndex(x=>x.id==='window');order.unshift(order.splice(wi,1)[0]);}
  order.forEach(x=>{
    const c=C[x.id];
    const t=h('button','hot');t.dataset.id=x.id;t.setAttribute('aria-label',x.n);
    t.style.left=(c.x/SW*100)+'%';t.style.top=(c.y/SH*100)+'%';t.style.width=(c.w/SW*100)+'%';t.style.height=(c.h/SH*100)+'%';

  });

}

function giveHint(auto){

}

const LOCKS={
  door:{img:'img/lock_door.jpg',view:[230,30,1300,950],y:[296,694],x:[[410,815],[944,1350]]},
  hatch:{img:'img/lock_hatch.jpg',view:[0,0,1536,1024],y:[314,740],x:[[276,722],[784,1228]]},

function lockWidget(name,val){
  const L=LOCKS[name],NS='http://www.w3.org/2000/svg';
  const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const box=h('div','lock');box.dataset.lock=name;
  const svg=el('svg',{viewBox:L.view.join(' ')});svg.append(el('image',{href:L.img,width:1536,height:1024}));
  const texts=[];let locked=false;
  const turn=(i,d)=>{
    if(locked)return;val[i]=(val[i]+d+10)%10;const t=texts[i];t.textContent=val[i];box.classList.remove('shake');
    t.classList.remove('roll');t.style.setProperty('--from',(d*60)+'px');t.getBoundingClientRect();t.classList.add('roll');
  };
  L.x.forEach(([x1,x2],i)=>{
    const [y1,y2]=L.y,cx=(x1+x2)/2,cy=(y1+y2)/2,w=x2-x1,ht=y2-y1;
    const t=el('text',{x:cx,y:cy,class:'digit','font-size':Math.min(ht*.5,w*.9)});t.textContent=val[i];texts.push(t);svg.append(t);
    [[1,y1],[-1,cy]].forEach(([d,top])=>{
      const z=el('g',{class:'wheel',role:'button',tabindex:0,'data-i':i,'data-d':d,'aria-label':(i+1)+'번째 칸 '+(d>0?'올리기':'내리기')});
      const a=Math.min(w*.16,26),ay=d>0?y1+a*1.1:y2-a*1.1;
      z.append(el('rect',{x:x1,y:top,width:w,height:ht/2,class:'zone'}),el('path',{class:'arrow',d:'M'+(cx-a)+' '+(ay+d*a*.45)+'L'+cx+' '+(ay-d*a*.45)+'L'+(cx+a)+' '+(ay+d*a*.45)+'Z'}));
      z.addEventListener('click',()=>turn(i,d));
      z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();turn(i,d);}});
      svg.append(z);
    });
  });
  box.append(svg);
  return {el:box,
    value:()=>val.join(''),
    set(v){[...v].forEach((c,i)=>{val[i]=+c;texts[i].textContent=c;});box.classList.remove('shake');},
    shake(){box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');},
    win(){locked=true;box.classList.add('won');}
  };
}

function magicPop(){
  if(f.open){say('금고는 이미 열렸다.');return;}
  f.board=f.board||GIVEN.slice();
  modal((p,close)=>{
    p.append(h('h3','','금고 문의 숫자판'),h('p','','1부터 9까지의 수를 한 번씩 써서, 가로·세로·대각선의 합이 모두 같게 만들어라.'));
    const grid=h('div','magic'),tiles=h('div','tiles'),msg=h('p','','');
    let pick=0,done=false;
    const draw=()=>{
      const b=f.board;

      const good=LINES.filter(l=>l.every(i=>b[i])&&b[l[0]]+b[l[1]]+b[l[2]]===15),won=good.length===LINES.length;
      grid.textContent='';
      b.forEach((v,i)=>{
        const c=h('button','cell'+(GIVEN[i]?' fixed':'')+(won?' line':''),v?String(v):'');
        c.dataset.i=i;c.setAttribute('aria-label',(Math.floor(i/3)+1)+'행 '+(i%3+1)+'열 '+(v||'빈칸'));
        c.onclick=()=>place(i);grid.append(c);
      });
      const NS='http://www.w3.org/2000/svg',v=document.createElementNS(NS,'svg');v.setAttribute('viewBox','0 0 244 244');
      if(!won)good.forEach(l=>{
        const at=i=>[38+(i%3)*84,38+Math.floor(i/3)*84],[x1,y1]=at(l[0]),[x2,y2]=at(l[2]),ex=Math.sign(x2-x1)*30,ey=Math.sign(y2-y1)*30;
        const ln=document.createElementNS(NS,'line');[['x1',x1-ex],['y1',y1-ey],['x2',x2+ex],['y2',y2+ey]].forEach(([k,n])=>ln.setAttribute(k,n));v.append(ln);
      });
      grid.append(v);
      tiles.textContent='';
      for(let n=1;n<=9;n++){
        if(b.includes(n))continue;
        const t=h('button','tile'+(pick===n?' sel':''),String(n));
        t.onclick=()=>{pick=pick===n?0:n;draw();};tiles.append(t);
      }
    };
    const place=i=>{
      if(done||GIVEN[i])return;
      const b=f.board;msg.textContent='';
      if(pick){b[i]=pick;pick=0;}
      else if(b[i])b[i]=0;
      else{msg.textContent='아래에서 숫자 조각을 먼저 고르자.';return;}
      draw();
      if(!b.every(Boolean))return;
      if(LINES.every(l=>b[l[0]]+b[l[1]]+b[l[2]]===15)){
        done=true;f.open=1;msg.textContent='찰칵. 모든 줄에 불이 들어왔다.';msg.className='ok';
        setTimeout(()=>{close();ringLayer(true);say('금고의 링이 돌기 시작한다.');watch(4600,()=>say('금고 문이 열렸다. 안에 양피지 두 장과 잠긴 상자가 있다.'));setTimeout(()=>{if(S.room==='v'&&f.open)openSafe();},2400);},1500);
      }else{miss();msg.textContent='링이 덜컹거리다 멈춘다. 놓은 수를 누르면 뺄 수 있다.';msg.className='bad';}
    };
    draw();
    const x=h('button','btn','닫기');x.onclick=close;const r=h('div','row');r.append(x);
    p.append(grid,tiles,msg,r);
  });
}

      {i:'🔥',id:'torch',n:'타오르는 횃불',fn(){say('뜨거워서 손을 댈 수 없다.');}},
      {i:'🌙',id:'window',n:'높은 창',fn(){say('창밖으로 달빛 아래 어두운 바다가 보인다. 창이 높고 좁아 나갈 수 없다.');}},
      {i:'🍞',id:'bread',n:'식은 빵과 부스러기',fn(){say('책상 구석에 식은 빵과 쿠키 부스러기가 있다. 빵집 할머니의 쿠키와 같은 모양이다.');}}
    ]},
  r2:{title:'방 2 · 꼭대기 제어판',goal:'꺼진 등불을 다시 켜라.',
    introTitle:'등대 꼭대기',intro:['꼭대기는 캄캄하다. 등불은 모두 꺼져 있고 제어판은 먹통이다.','방 1에서 챙겨 온 손전등이 손에 들려 있다.'],introBtn:'주위를 둘러본다',
    hints:['먹통인 제어판은 전원부터 살려야 한다. 어두워서 안 보이는 곳이 있다.','카드 두 장이 창틀과 계단 난간에 있다. 가방에서 카드를 고른 뒤 제어판을 눌러 꽂자.','2번은 부러진 윗부분의 길이를 먼저 구하자. 그림을 누르면 크게 볼 수 있다. 참인 카드는 3번과 4번이다.'],
    hot:[
      {i:'🕳️',id:'vent',n:'천장 환기구',fn(){
        if(f.vent){say('환기구는 이미 살펴보았다.');return;}
        if(S.sel==='flash'){f.vent=1;take('flash');give('fuse');say('손전등으로 비추자 거미줄 사이에 낀 유리관 퓨즈가 보인다.');}
        else say('너무 어두워서 안쪽이 보이지 않는다.');}},
      {i:'🧰',id:'toolbox',n:'도구함',fn(){if(f.tool){say('도구함은 비어 있다.');return;}f.tool=1;give('gloves');give('lever');give('lens');say('도구함에서 절연 장갑, 황동 레버, 돋보기를 찾았다.');}},
      {i:'🪟',id:'crack',n:'창틀 틈새',fn(){if(f.crack){say('더 나올 것이 없다.');return;}f.crack=1;give('card2');say('창틀 틈새에서 “2”라고 적힌 카드를 찾았다.');}},
      {i:'🪜',id:'rail',n:'계단 난간 구석',fn(){if(f.rail){say('더 나올 것이 없다.');return;}f.rail=1;give('card4');say('난간 구석에서 “4”라고 적힌 카드를 찾았다.');}},
      {i:'⚡',id:'fusebox',n:'벽면 배전반',fn(){
        if(f.power){say('전원이 들어와 있다.');return;}
        if(!f.gloves){
          if(S.sel==='gloves'){f.gloves=1;take('gloves');say('장갑을 끼고 배전반 문을 열었다. 빈 퓨즈 자리와 레버 자리가 보인다.');return;}
          say('전선이 드러나 있다. 맨손으로 만지면 위험하다.');return;}
        if(S.sel==='fuse'){f.fuse=1;take('fuse');say('퓨즈를 끼우자 파직, 불꽃이 튀었다.');return;}
        if(S.sel==='lever'){
          if(!f.fuse){say('레버를 끼우기 전에 빈 퓨즈 자리부터 채워야 할 것 같다.');return;}
          f.power=1;take('lever');say('레버를 끼워 올리자 제어판에 희미한 불이 들어왔다.');return;}
        say(f.fuse?'퓨즈는 끼웠다. 레버 자리가 비어 있다.':'배전반 안에 퓨즈 자리와 레버 자리가 비어 있다.');}},
      {i:'🎛️',id:'panel',n:'제어판',fn(){
        if(S.sel==='card2'||S.sel==='card4'){
          const n=S.sel==='card2'?2:4;S.mount[n-1]=true;take('card'+n);say('제어판의 '+n+'번 자리에 카드를 꽂았다.');return;}
        if(!f.power){say('제어판은 먹통이다. 전원이 들어오지 않는다.');return;}
        panelPop();}},
      {i:'⏲️',id:'gauge',n:'압력 게이지',fn(){say('바늘이 0에 멈춰 있다.');}},
      {i:'🔭',id:'lens',n:'거대한 렌즈',fn(){say('먼지 낀 거대한 렌즈다. 불이 켜지면 바다 멀리까지 빛을 보낼 것이다.');}},
      {i:'🧭',id:'compass',n:'고장 난 나침반',fn(){say('바늘이 빙글빙글 돈다. 제어판 근처에 전류가 흐르는 듯하다.');}},
      {i:'🗺️',id:'map',n:'벽면 섬 지도',fn(){say('섬 지도다. 부두 쪽에 낡은 창고가 그려져 있다.');}},
      {i:'🌊',id:'sea',n:'폭풍 속 바다',fn(){say('파도가 거세다. 창은 굳게 닫혀 있다.');}}
    ]},
  r3:{title:'방 3 · 부두 창고',goal:'가짜 상자를 찾아 해치를 열어라.',
    introTitle:'부두 창고',intro:['새벽 안개가 낮게 깔린 부두. 낡은 창고 안에 상자 다섯 개가 놓여 있다.','그 가운데 하나는 등대지기가 몰래 섞어 둔 가짜다.'],introBtn:'주위를 둘러본다',
    hints:['가방에서 돋보기를 고른 뒤 번진 장부를 눌러 보자. 바코드 다섯 개는 모둠이 나눠 계산하자.','앞 일곱 자리에 3, 1, 3, 1, 3, 1, 3을 곱해 더하면 마지막 자리가 정해진다. 합은 10의 배수가 되어야 한다.','2번 상자만 맞지 않는다. 해치에는 가짜 상자의 번호와 올바른 마지막 자리를 이어 쓴다.'],
    hot:[
      {i:'📖',id:'ledger',n:'관리 데스크 장부',fn(){ledger3();}},
      {i:'🧰',id:'shelf',n:'선반 위 도구함',fn(){if(f.shelf){say('더 나올 것이 없다.');return;}f.shelf=1;give('crowbar');say('녹슨 쇠지렛대가 들어 있다.');}},
      crateHot(1),crateHot(2),crateHot(3),crateHot(4),crateHot(5),
      {i:'🕳️',id:'hatch',n:'바닥 철제 해치',fn(){hatchPop();}},
      {i:'🕸️',id:'nets',n:'찢어진 어망',fn(){say('비린내가 진동한다. 마른 조개껍데기뿐이다.');}},
      {i:'🚜',id:'forklift',n:'녹슨 지게차',fn(){say('시동 키가 뽑혀 있고 바퀴에 바람이 빠져 있다.');}},
      {i:'⛵',id:'boat',n:'묶인 나룻배',fn(){say('노가 부러져 있어 타고 나갈 수 없다.');}},
      {i:'🏮',id:'barrel',n:'통 위의 등불',fn(){say('등불이 흔들린다. 통 뚜껑에는 분필 자국이 있다.');}}
    ]},
  v:{title:'금고 · 등대지기의 방',goal:'금고를 열어라.',
    introTitle:'등대지기의 방',intro:['작은 방 한가운데 무쇠 금고가 웅크리고 있다.','사다리를 내려서자 금고 문의 링이 하나씩 빛나기 시작한다.'],introBtn:'주위를 둘러본다',
    onEnter:()=>ringLayer(false),
    after:['금고 속 양피지를 눌러 보자. 아웃으로 나온 숫자부터 모두 지우자.','같은 숫자가 나온 두 줄을 비교하면 그 숫자의 자리를 좁힐 수 있다.','첫째 암호 세 자리 뒤에 둘째 암호 세 자리를 이어 상자에 넣는다.'],
    hints:['금고 문을 눌러 보자.','1부터 9까지를 모두 더하면 45다. 가로줄이 셋이면 한 줄의 합은 얼마일까?','한 줄의 합은 15다. 두 칸이 채워진 줄부터 남은 수를 구하자.'],
    hot:[
      {i:'🔒',id:'ring',n:'금고 문',fn(){magicPop();}},
      {i:'🖼️',id:'portrait',n:'등대지기 초상화',fn(){say('온화한 미소의 노인 초상화다. 빵집 할머니와 어딘가 닮았다.');}},
      {i:'🍪',id:'cookiebox',n:'빈 쿠키 상자',fn(){say('체험학습 첫날 받았던 쿠키 상자와 같은 상자다.');}},
      {i:'🧭',id:'sextant',n:'황동 육분의',fn(){say('별의 높이를 재어 배의 위치를 찾는 도구다.');}},
      {i:'🔭',id:'spyglass',n:'창턱의 망원경',fn(){say('멀리 등대 불빛이 흔들린다.');}}
    ]}
};

newState();
story(INTRO.title,INTRO.lines,'눈을 뜬다',()=>startRoom('r1',[]));
</script>
